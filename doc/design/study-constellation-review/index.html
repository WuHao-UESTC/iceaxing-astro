<!doctype html><html lang="zh-CN" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>学习笔记 · 星图样式提案</title><style>
*{box-sizing:border-box}body{margin:0;background:#101715;color:#eaf0ed;font-family:Inter,'Microsoft YaHei',sans-serif}button{font:inherit;cursor:pointer}header{padding:26px 36px 22px;border-bottom:1px solid #2a3732}header small{color:#8ec9bc;letter-spacing:.18em;font-size:10px}h1{font-family:Georgia,'SimSun',serif;font-size:30px;font-weight:400;margin:10px 0}header p{margin:0;color:#a0afa8;font-size:12px;line-height:1.8}.toolbar{display:flex;gap:20px;justify-content:space-between;align-items:center;padding:18px 36px}.tabs,.controls{display:flex;gap:6px;flex-wrap:wrap}button{color:#a0afa8;background:transparent;border:1px solid #33413b;padding:10px 14px;border-radius:5px;font-size:12px}button[aria-pressed=true]{color:#102019;background:#b9d7ca;border-color:#b9d7ca}button:hover{border-color:#8ec9bc}.caption{padding:0 36px 18px;display:flex;justify-content:space-between;align-items:baseline;gap:16px}.caption strong{font-size:14px;font-weight:500}.caption p{font-size:12px;color:#a0afa8;margin:5px 0 0}.caption output{font-size:10px;color:#8ec9bc;font-family:monospace;white-space:nowrap}.viewport{margin:0 auto 24px;position:relative;overflow:hidden;background:#0d1211;box-shadow:0 0 0 1px #33413b}iframe{position:absolute;top:0;left:0;border:0;transform-origin:0 0;background:#0d1211}footer{padding:0 36px 28px;color:#86978f;font-size:11px;line-height:1.8}a{color:#b9d7ca}button:focus-visible{outline:2px solid #8ec9bc;outline-offset:3px}@media(max-width:700px){header{padding:22px 18px}.toolbar{padding:16px 18px;align-items:start;flex-direction:column;gap:12px}.caption{padding:0 18px 18px;flex-direction:column;gap:6px}h1{font-size:25px}button{padding:9px 10px}.controls button{font-size:11px}footer{padding:0 18px 24px}}
</style></head><body><header><small>STUDY / CONSTELLATION EXPLORATIONS</small><h1>学习笔记，四种观星方式。</h1><p>默认展示 40 颗星全部点亮，可切回原状态；保持星点坐标与画布大小，比较四种星图样式。</p></header><div class="toolbar"><nav class="tabs" aria-label="选择方案"><button data-option="A" aria-pressed="true">A · 疏朗星座</button><button data-option="B" aria-pressed="false">B · 测绘图谱</button><button data-option="C" aria-pressed="false">C · 柔光星轨</button><button data-option="D" aria-pressed="false">D · 书页星标</button><button data-option="current" aria-pressed="false">当前样式</button></nav><div class="controls"><button id="lighting" aria-pressed="true">40 颗全部点亮</button><button id="theme">切换浅色</button><button id="device">手机 390 × 844</button><button id="reset">还原星图</button></div></div><div class="caption"><div><strong id="style-name"></strong><p id="style-description"></p></div><output id="dimensions">正在测量画布…</output></div><div class="viewport"><iframe title="星图方案预览" src="a.html"></iframe></div><footer>全亮预览含 8 个真实教材入口与 32 个示例亮星，示例亮星不代表新增教材。可悬停查看教材，点击教材星展开笔记；按 Esc 或“返回完整星图”复位。预览按比例缩放，内部仍使用原页面的实际像素尺寸。<br>正式页面尚未修改。选定 A / B / C / D 后，再将样式应用到页面。 · <a id="standalone" href="a.html" target="_blank">单独打开当前方案 ↗</a></footer><script>
const options=[["A","疏朗星座","细实线 · 环形星点 · 清晰留白","连线只保留一条主星座与少量暗线，阅读更安静。"],["B","测绘图谱","坐标辅助线 · 菱形星点 · 技术感","以克制的测量刻度和虚实线，呼应知识地图与山地测绘。"],["C","柔光星轨","轻曲线 · 四芒星 · 柔和光晕","用连续的轻弧线连接教材，让星群更流动、更有夜空感。"],["D","书页星标","点状连线 · 旁注标签 · 编辑感","像书页边的知识批注，标题更突出，图形退到背景。"]],frame=document.querySelector('iframe'),viewport=document.querySelector('.viewport');let selected='A',theme='dark',mobile=false,allLit=true;function size(){const w=mobile?390:1440,h=mobile?844:1000,scale=Math.min(1,(innerWidth-36)/w);frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform='scale('+scale+')';viewport.style.width=w*scale+'px';viewport.style.height=h*scale+'px'}function caption(){const o=options.find(o=>o[0]===selected);document.querySelector('#style-name').textContent=o?o[0]+' / '+o[2]:'原页面 / 当前星图';document.querySelector('#style-description').textContent=o?o[3]:'保留原始节点和完整背景连线，作为对照。';document.querySelector('#standalone').href=selected.toLowerCase()+'.html'}document.querySelectorAll('[data-option]').forEach(b=>b.addEventListener('click',()=>{selected=b.dataset.option;document.querySelectorAll('[data-option]').forEach(x=>x.setAttribute('aria-pressed',x===b));frame.src=selected.toLowerCase()+'.html';caption()}));frame.addEventListener('load',()=>{frame.contentWindow.postMessage({type:'theme',theme},'*');frame.contentWindow.postMessage({type:'lighting',allLit},'*')});document.querySelector('#lighting').onclick=()=>{allLit=!allLit;frame.contentWindow.postMessage({type:'lighting',allLit},'*');document.querySelector('#lighting').textContent=allLit?'40 颗全部点亮':'仅点亮 8 颗教材星';document.querySelector('#lighting').setAttribute('aria-pressed',allLit)};document.querySelector('#theme').onclick=()=>{theme=theme==='dark'?'light':'dark';frame.contentWindow.postMessage({type:'theme',theme},'*');document.querySelector('#theme').textContent=theme==='dark'?'切换浅色':'切换深色'};document.querySelector('#device').onclick=()=>{mobile=!mobile;size();document.querySelector('#device').textContent=mobile?'桌面 1440 × 1000':'手机 390 × 844'};document.querySelector('#reset').onclick=()=>frame.contentWindow.postMessage({type:'reset'},'*');window.addEventListener('resize',size);window.addEventListener('message',e=>{if(e.source!==frame.contentWindow||e.data.type!=='metrics')return;const d=e.data;document.querySelector('#dimensions').textContent='星图区域 '+Math.round(d.map.width)+' × '+Math.round(d.map.height)+' px · 原尺寸'});size();caption();
</script></body></html>
