name: Notify publications

on:
  push:
    branches:
      - main
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publication-notifications
  cancel-in-progress: false

jobs:
  notify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out publication manifest
        if: github.event_name == 'push'
        uses: actions/checkout@v4

      - name: Wait for the production publication manifest
        if: github.event_name == 'push'
        env:
          SITE_URL: ${{ secrets.PRODUCTION_SITE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SITE_URL"
          expected_hash=$(jq -cS . public/publication-manifest.json | sha256sum | cut -d ' ' -f 1)
          for attempt in $(seq 1 40); do
            remote_manifest=$(curl --fail-with-body --silent --show-error \
              "${SITE_URL%/}/publication-manifest.json?commit=${GITHUB_SHA}" || true)
            if jq -e . >/dev/null 2>&1 <<< "$remote_manifest"; then
              remote_hash=$(jq -cS . <<< "$remote_manifest" | sha256sum | cut -d ' ' -f 1)
              if [ "$remote_hash" = "$expected_hash" ]; then
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Production did not publish the expected manifest within the timeout" >&2
          exit 1

      - name: Trigger idempotent publication notification
        env:
          SITE_URL: ${{ secrets.PRODUCTION_SITE_URL }}
          NOTIFY_SECRET: ${{ secrets.PUBLICATION_NOTIFY_SECRET }}
        shell: bash
        run: |
          test -n "$SITE_URL"
          test -n "$NOTIFY_SECRET"
          for attempt in $(seq 1 20); do
            response=$(curl --fail-with-body --retry 3 --retry-all-errors \
              --request POST \
              --header "Authorization: Bearer ${NOTIFY_SECRET}" \
              --header "Content-Type: application/json" \
              "${SITE_URL%/}/api/publications/notify")
            remaining=$(jq -r '.data.remaining // 0' <<< "$response")
            if [ "$remaining" -eq 0 ]; then
              exit 0
            fi
            sleep 2
          done
          echo "Notification queue did not drain after 20 batches" >&2
          exit 1
